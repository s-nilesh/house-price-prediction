[project]
name = "house-price-prediction"
version = "0.1.0"
description = "This project is the implementation of end to end ML projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "mlflow>=3.2.0",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "scikit-learn>=1.7.1",
    "starlette>=0.47.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ipykernel>=6.30.1"
]
test = [
    "pytest>=8.4.1"
]

[tool.ruff]
lint.extend-select = []
lint.ignore = ["PTH123", "N806", "N803"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20